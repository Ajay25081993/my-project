name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to AWS?"
        required: false
        default: "false"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest || true; fi

      - name: Build Docker image
        run: docker build -t my-app:latest .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Validate Terraform
        run: |
          cd terraform
          terraform init -input=false
          terraform validate
          terraform fmt -check

      - name: Configure AWS credentials
        if: ${{ github.event.inputs.deploy == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Push to Amazon ECR
        if: ${{ github.event.inputs.deploy == 'true' }}
        run: |
          aws ecr get-login-password --region ap-south-2 | docker login --username AWS --password-stdin 206482633930.dkr.ecr.ap-south-2.amazonaws.com
          docker tag my-app:latest 206482633930.dkr.ecr.ap-south-2.amazonaws.com/my-app:latest
          docker push 206482633930.dkr.ecr.ap-south-2.amazonaws.com/my-app:latest

      - name: Deploy to EC2
        if: ${{ github.event.inputs.deploy == 'true' }}
        run: |
          cd terraform
          terraform apply -auto-approve
